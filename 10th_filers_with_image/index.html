<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <title>Filter with image</title>
</head>

<body>
    <h1 class="blur-sm">blur text </h1>
    <img src="gow.png" alt="">
    <!-- blur -->
    <div class="space-y-4">
        <img class="blur-none" src="gow.png" alt="No blur">
        <img class="blur-sm" src="gow.png" alt="Small blur">
        <img class="blur" src="gow.png" alt="Default blur">
        <img class="blur-md" src="gow.png" alt="Medium blur">
        <img class="blur-lg" src="gow.png" alt="Large blur">
        <img class="blur-xl" src="gow.png" alt="Extra large blur">
        <img class="blur-2xl" src="gow.png" alt="2xl blur">
        <img class="blur-3xl" src="gow.png" alt="3xl blur">
    </div>

    <!-- brightnew -->
    <img class="brightness-50" src="gow.png" alt="">
    <img class="brightness-100" src="gow.png" alt="">
    <img class="brightness-150" src="gow.png" alt="">
    <img class="brightness-200" src="gow.png" alt="">
    <img class="brightness-250" src="gow.png" alt="">
    <img class="brightness-300" src="gow.png" alt="">

    <!-- contrast -->
    <img class="contrast-0" src="gow.png" alt="">
    <img class="contrast-50" src="gow.png" alt="">
    <img class="contrast-100" src="gow.png" alt="">
    <img class="contrast-150" src="gow.png" alt="">
    <img class="contrast-200" src="gow.png" alt="">
    <img class="contrast-250" src="gow.png" alt="">


    <!-- grayscale -->
    <img class="grayscale-0" src="gow.png" alt="No grayscale">
    <img class="grayscale" src="gow.png" alt="Full grayscale">

    <!-- invert -->
    <img class="invert" src="gow.png" alt="">

    <!-- hue -->
     <img class="hue-rotate-15" src="gow.png" alt="">
     <img class="hue-rotate-60" src="gow.png" alt="">
     <img class="hue-rotate-100" src="gow.png" alt="">
     <img class="hue-rotate-150" src="gow.png" alt="">

     
    </body>

</html>
