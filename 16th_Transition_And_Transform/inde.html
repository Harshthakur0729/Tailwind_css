<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <title>Transitiion and transform</title>
</head>

<body>
    <button class="bg-blue-500 p-2 m-10 text-white rounded hover:bg-blue-300">
        Botton 1
    </button>

    <button class="bg-blue-500 p-2 m-10 text-white rounded hover:bg-blue-300 Transitiion duration-1000">
        Botton 2
    </button>

    <button class="bg-blue-500 p-2 m-10 text-white rounded hover:opacity-5 Transitiion duration-1000">
        Botton 3
    </button>

    <button class="bg-blue-500 p-2 m-10 text-white rounded hover:rotate-360 Transitiion-transform duration-1000">
        Botton 4
    </button>

    <button class="bg-blue-500 p-2 m-10 text-white rounded active:scale-5 Transitiion-transform duration-1000">
        Botton 5
    </button>

    <button class="bg-blue-500 p-2 m-10 text-white rounded active:scale-5 Transitiion duration-1000">
        Botton 6
    </button>

    <button class="bg-blue-500 p-2 m-10 text-white rounded active:scale-x-30 Transitiion duration-1000">
        Botton 7
    </button>


    <img class="m-20 w-56 hover:rotate-45 hover:scale-125 Transitiion-transform duration-1000 " src="gow.png" alt="">
</body>

</html>
