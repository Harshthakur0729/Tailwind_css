<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
</head>

<body>
    <button class="bg-blue-400 p-2 m-4 rounded-md text-white">button</button>
    <!-- hover -->
    <button class="bg-blue-400 p-2 m-4 rounded-md text-white hover:bg-blue-900 hover:p-3">button</button>
    <!-- focus -->
    <button class="bg-blue-400 p-2 m-4 rounded-md text-white focus:bg-yellow-600">button</button>
    <!-- active -->
    <button class="bg-blue-400 p-2 m-4 rounded-md text-white active:bg-red-500">button</button>
    <!-- hover focus active -->
    <button class="bg-blue-400 p-2 m-4 rounded-md text-white
    hover:bg-red-500 
    active:bg-green-500 
    focus:bg-yellow-600">button</button>
<!-- group hover -->

<div>
    <a class="group">
        <h1 class="group-hover:text-blue-500 group-hover:bg-red-500">text</h1>
        <h2>group</h2>
    </a>
</div>
</body>

</html>
